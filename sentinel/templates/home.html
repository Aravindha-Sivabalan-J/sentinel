<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SENTINEL - Home</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { color: #333; }
    .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
    .section h2 { margin-top: 0; color: #555; }
    input[type="text"], input[type="file"] { padding: 8px; margin: 5px 0; width: 300px; }
    button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error { color: red; margin: 10px 0; }
    .success { color: green; margin: 10px 0; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 5% auto; padding: 20px; width: 80%; max-width: 800px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .close { font-size: 28px; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f2f2f2; }
    tr:hover { background: #f5f5f5; }
    .selected { background: #d4edda !important; }
    .loading { display: none; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>SENTINEL - Video & Audio Analysis</h1>

  <!-- Section 1: Upload Image/Video -->
  <div class="section">
    <h2>Upload Image or Video</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="file" name="file" required />
      <button type="submit">Upload & Process</button>
    </form>
  </div>

  <!-- Section 2: YouTube Video Download -->
  <div class="section">
    <h2>Download YouTube Video</h2>
    <div id="youtube-message"></div>
    <input type="text" id="youtube-url" placeholder="Enter YouTube URL" />
    <input type="text" id="video-name" placeholder="Enter video name" />
    <button id="download-btn" onclick="downloadYouTube()">Download Video</button>
    <div id="youtube-loading" class="loading">Downloading...</div>
  </div>

  <!-- Section 3: Upload Media to Database -->
  <div class="section">
    <h2>Upload Media to Database</h2>
    <div id="media-upload-message"></div>
    <input type="file" id="media-file" accept=".mp3,.wav,.flac,.m4a,.mp4,.avi,.mov,.mkv,.webm" />
    <input type="text" id="media-name" placeholder="Enter media name" />
    <button id="upload-media-btn" onclick="uploadMediaToDB()">Upload & Process to DB</button>
    <div id="media-upload-loading" class="loading">Uploading...</div>
  </div>

  <!-- Section 4: View Database -->
  <div class="section">
    <h2>View Database</h2>
    <button onclick="window.location.href='/view-db/'">📁 VIEW ALL MEDIA</button>
  </div>

  <!-- Section 5: Enroll Person -->
  <div class="section">
    <h2>Enroll New Person</h2>
    <button onclick="window.location.href='{% url 'core:enroll_person' %}'">Go to Enrollment</button>
  </div>

  <!-- Section 6: Search Across Media -->
  <div class="section">
    <h2>Search Person Across Media</h2>
    <button onclick="window.location.href='{% url 'core:search_media' %}'">🔍 SEARCH MEDIA</button>
  </div>

  <!-- Section 7: Live Detection -->
  <div class="section">
    <h2>Live Face Detection</h2>
    <button onclick="window.location.href='{% url 'core:live_detection' %}'">GO TO LIVE</button>
  </div>



  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    async function downloadYouTube() {
      const url = document.getElementById('youtube-url').value;
      const name = document.getElementById('video-name').value;
      const btn = document.getElementById('download-btn');
      const loading = document.getElementById('youtube-loading');
      const msgDiv = document.getElementById('youtube-message');

      if (!url || !name) {
        msgDiv.innerHTML = '<p class="error">Please enter both URL and name</p>';
        return;
      }

      btn.disabled = true;
      loading.style.display = 'block';
      msgDiv.innerHTML = '';

      try {
        const response = await fetch('{% url "core:download_youtube" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
          },
          body: `youtube_url=${encodeURIComponent(url)}&video_name=${encodeURIComponent(name)}`
        });

        const data = await response.json();
        if (data.success) {
          msgDiv.innerHTML = `<p class="success">${data.message}</p>`;
          document.getElementById('youtube-url').value = '';
          document.getElementById('video-name').value = '';
        } else {
          msgDiv.innerHTML = `<p class="error">${data.error}</p>`;
        }
      } catch (error) {
        msgDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    async function uploadMediaToDB() {
      const fileInput = document.getElementById('media-file');
      const name = document.getElementById('media-name').value;
      const btn = document.getElementById('upload-media-btn');
      const loading = document.getElementById('media-upload-loading');
      const msgDiv = document.getElementById('media-upload-message');

      if (!fileInput.files[0] || !name) {
        msgDiv.innerHTML = '<p class="error">Please select a file and enter a name</p>';
        return;
      }

      btn.disabled = true;
      loading.style.display = 'block';
      msgDiv.innerHTML = '';

      const formData = new FormData();
      formData.append('media_file', fileInput.files[0]);
      formData.append('media_name', name);

      try {
        const response = await fetch('{% url "core:upload_media_to_db" %}', {
          method: 'POST',
          headers: { 'X-CSRFToken': getCookie('csrftoken') },
          body: formData
        });

        const data = await response.json();
        if (data.success) {
          msgDiv.innerHTML = `<p class="success">${data.message}</p>`;
          fileInput.value = '';
          document.getElementById('media-name').value = '';
          
          setTimeout(() => {
            window.location.href = '/view-db/';
          }, 2000);
        } else {
          msgDiv.innerHTML = `<p class="error">${data.error}</p>`;
        }
      } catch (error) {
        msgDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
